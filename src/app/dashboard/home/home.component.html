<div class="dashboard">
  <div class="welcome">
    <h2>Selamat datang, <strong>{{ user?.username }}</strong> 👋</h2>
    <p>{{ user?.company_name }} — {{ today | date:'EEEE, d MMMM y' : '' : 'id' }}</p>
  </div>

  <div class="stats-grid">
    <mat-card class="stat-card" *ngFor="let stat of stats">
      <div class="stat-icon" [style.background]="stat.color + '1a'">
        <mat-icon [style.color]="stat.color">{{ stat.icon }}</mat-icon>
      </div>
      <div class="stat-info">
        <div class="stat-value">{{ stat.value }}</div>
        <div class="stat-label">{{ stat.label }}</div>
      </div>
    </mat-card>
  </div>
</div>
