<div class="card shadow-sm border-0 rounded-3 mb-3">
  <div class="card-body p-4">
    <h6 class="fw-bold mb-3">Ajukan Rencana Lembur</h6>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Tanggal</mat-label>
        <input matInput [matDatepicker]="dpOvertime" formControlName="date">
        <mat-datepicker-toggle matIconSuffix [for]="dpOvertime"></mat-datepicker-toggle>
        <mat-datepicker #dpOvertime></mat-datepicker>
      </mat-form-field>

      <div class="row g-2">
        <div class="col-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Jam Mulai</mat-label>
            <input matInput type="text" [ngxMatTimepicker]="pickerStart" [format]="24" formControlName="planned_start" readonly>
            <ngx-mat-timepicker-toggle matSuffix [for]="pickerStart"></ngx-mat-timepicker-toggle>
            <ngx-mat-timepicker #pickerStart></ngx-mat-timepicker>
          </mat-form-field>
        </div>
        <div class="col-6">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Jam Selesai</mat-label>
            <input matInput type="text" [ngxMatTimepicker]="pickerEnd" [format]="24" formControlName="planned_end" readonly>
            <ngx-mat-timepicker-toggle matSuffix [for]="pickerEnd"></ngx-mat-timepicker-toggle>
            <ngx-mat-timepicker #pickerEnd></ngx-mat-timepicker>
          </mat-form-field>
        </div>
      </div>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Alasan / Pekerjaan yang Dikerjakan</mat-label>
        <textarea matInput rows="2" formControlName="reason"></textarea>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Mengirim...' : 'Kirim Pengajuan' }}
      </button>
    </form>
  </div>
</div>

<div class="card shadow-sm border-0 rounded-3">
  <div class="card-body p-4">
    <h6 class="fw-bold mb-3">Riwayat Lembur</h6>

    <div *ngIf="loadingHistory" class="d-flex justify-content-center py-4">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <div class="overtime-row" *ngFor="let r of requests">
      <div>
        <div class="fw-bold">{{ r.date | date:'EEEE, d MMM y':'UTC' }}</div>
        <div class="text-muted small">{{ r.planned_start }} – {{ r.planned_end }} ({{ r.planned_hours }} jam)</div>
        <div class="text-muted small">{{ r.reason }}</div>
      </div>
      <span class="badge" [ngClass]="statusColor(r.status)">{{ statusLabel(r.status) }}</span>
    </div>

    <div class="text-muted text-center py-3" *ngIf="!loadingHistory && requests.length === 0">
      Belum ada pengajuan lembur.
    </div>
  </div>
</div>
