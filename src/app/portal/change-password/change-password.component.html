<div class="card shadow-sm border-0 rounded-3 change-password-card">
  <div class="card-body p-4">
    <h5 class="fw-bold mb-1">Ganti Password</h5>
    <p class="text-muted small mb-3" *ngIf="isMandatory">
      Ini pertama kali kamu login. Untuk keamanan, ganti dulu password default
      sebelum lanjut menggunakan sistem.
    </p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Password Saat Ini</mat-label>
        <input matInput type="password" formControlName="current_password">
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Password Baru</mat-label>
        <input matInput type="password" formControlName="new_password">
        <mat-hint>Minimal 6 karakter</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Konfirmasi Password Baru</mat-label>
        <input matInput type="password" formControlName="confirm_password">
      </mat-form-field>

      <div class="alert alert-danger py-2" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button mat-raised-button color="primary" class="w-100" type="submit" [disabled]="loading">
        {{ loading ? 'Menyimpan...' : 'Simpan Password Baru' }}
      </button>
    </form>
  </div>
</div>
