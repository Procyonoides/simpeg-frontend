<div class="card shadow-sm border-0 rounded-3">
  <div class="card-body p-4">
    <h6 class="fw-bold mb-3">Riwayat Absensi Saya</h6>

    <div class="row g-2 mb-3">
      <div class="col-6">
        <select class="form-select" [(ngModel)]="month" (change)="load()">
          <option *ngFor="let m of months" [value]="m.value">{{ m.label }}</option>
        </select>
      </div>
      <div class="col-6">
        <input class="form-control" type="number" [(ngModel)]="year" (change)="load()">
      </div>
    </div>

    <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div *ngIf="loading" class="d-flex justify-content-center py-4">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <div class="attendance-row" *ngFor="let r of records">
      <div>
        <div class="fw-bold">{{ r.attendance_date | date:'EEEE, d MMM y' }}</div>
      </div>
      <div class="text-end">
        <div>{{ r.check_in | date:'HH:mm' }} – {{ r.check_out | date:'HH:mm' }}</div>
      </div>
    </div>

    <div class="text-muted text-center py-3" *ngIf="!loading && records.length === 0">
      Tidak ada data absensi di bulan ini.
    </div>
  </div>
</div>
