<div class="card shadow-sm border-0 rounded-3 mb-3">
  <div class="card-body p-3">
    <div class="d-flex gap-2">
      <input class="form-control" placeholder="Cari nama, jabatan, atau departemen..."
        [(ngModel)]="searchTerm" (keyup.enter)="onSearch()">
      <button mat-raised-button color="primary" (click)="onSearch()">Cari</button>
    </div>
  </div>
</div>

<div *ngIf="loading" class="d-flex justify-content-center py-5">
  <mat-spinner diameter="36"></mat-spinner>
</div>

<div class="card shadow-sm border-0 rounded-3" *ngIf="!loading">
  <div class="card-body p-0">
    <div class="employee-row" *ngFor="let emp of employees">
      <img *ngIf="photoUrl(emp)" [src]="photoUrl(emp)" class="employee-photo" alt="">
      <div *ngIf="!photoUrl(emp)" class="employee-photo photo-placeholder">
        <mat-icon>person</mat-icon>
      </div>
      <div>
        <div class="fw-bold">{{ emp.full_name }}</div>
        <div class="text-muted small">{{ emp.position_name || '-' }} — {{ emp.department_name || '-' }}</div>
      </div>
    </div>
    <div class="text-muted text-center py-4" *ngIf="employees.length === 0">
      Tidak ditemukan.
    </div>

    <div class="d-flex justify-content-between align-items-center p-3" *ngIf="pagination.totalPages > 1">
      <span class="text-muted small">Halaman {{ pagination.page }} dari {{ pagination.totalPages }} ({{ pagination.total }} karyawan)</span>
      <div>
        <button mat-stroked-button [disabled]="pagination.page <= 1" (click)="prevPage()">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button mat-stroked-button class="ms-2" [disabled]="pagination.page >= pagination.totalPages" (click)="nextPage()">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
