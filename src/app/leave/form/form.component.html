<div class="page-container">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="fw-bold mb-1">Tambah Pengajuan</h5>
      <span class="text-muted small">Input pengajuan cuti, izin, atau sakit</span>
    </div>
    <button mat-button (click)="onCancel()">
      <mat-icon>arrow_back</mat-icon> Kembali
    </button>
  </div>

  <div class="card border-0 shadow-sm rounded-3">
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="row g-3">

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Karyawan *</mat-label>
              <mat-select formControlName="employee_id">
                <mat-option *ngFor="let e of employees" [value]="e.id">
                  {{ e.full_name }} ({{ e.employee_code }})
                </mat-option>
              </mat-select>
              <mat-error>Wajib dipilih</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Tipe Pengajuan *</mat-label>
              <mat-select formControlName="type">
                <mat-option value="annual">Cuti Tahunan</mat-option>
                <mat-option value="sick">Sakit</mat-option>
                <mat-option value="permission">Izin</mat-option>
              </mat-select>
              <mat-error>Wajib dipilih</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Tanggal Mulai *</mat-label>
              <input matInput [matDatepicker]="dpStart" formControlName="start_date">
              <mat-datepicker-toggle matIconSuffix [for]="dpStart"></mat-datepicker-toggle>
              <mat-datepicker #dpStart></mat-datepicker>
              <mat-error>Wajib diisi</mat-error>
            </mat-form-field>
          </div>

          <div class="col-md-6">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Tanggal Selesai *</mat-label>
              <input matInput [matDatepicker]="dpEnd" formControlName="end_date">
              <mat-datepicker-toggle matIconSuffix [for]="dpEnd"></mat-datepicker-toggle>
              <mat-datepicker #dpEnd></mat-datepicker>
              <mat-error>Wajib diisi</mat-error>
            </mat-form-field>
          </div>

          <div class="col-12">
            <mat-form-field appearance="outline" class="w-100">
              <mat-label>Alasan *</mat-label>
              <textarea matInput formControlName="reason" rows="3"
                placeholder="Jelaskan alasan pengajuan..."></textarea>
              <mat-error>Wajib diisi</mat-error>
            </mat-form-field>
          </div>

        </div>

        <div class="d-flex justify-content-end gap-2 mt-2">
          <button mat-button type="button" (click)="onCancel()">Batal</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            <mat-spinner *ngIf="loading" diameter="18" style="display:inline-block"></mat-spinner>
            <span *ngIf="!loading">Simpan</span>
          </button>
        </div>

      </form>
    </div>
  </div>

</div>
