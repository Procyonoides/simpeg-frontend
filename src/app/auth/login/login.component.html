<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>SIMPEG</mat-card-title>
      <mat-card-subtitle>Sistem Informasi Kepegawaian & Penggajian</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Username</mat-label>
          <input matInput formControlName="username" placeholder="Masukkan username">
          <mat-icon matSuffix>person</mat-icon>
          @if (loginForm.get('username')?.hasError('required')) {
            <mat-error>
              Username wajib diisi
            </mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password"
            [type]="hidePassword ? 'password' : 'text'"
            placeholder="Masukkan password">
            <button mat-icon-button matSuffix type="button"
              (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            @if (loginForm.get('password')?.hasError('required')) {
              <mat-error>
                Password wajib diisi
              </mat-error>
            }
          </mat-form-field>

          @if (errorMessage) {
            <mat-error class="error-message">
              {{ errorMessage }}
            </mat-error>
          }

          <button mat-raised-button color="primary" type="submit"
            class="full-width login-btn" [disabled]="loading">
            @if (loading) {
              <mat-spinner diameter="20"></mat-spinner>
            }
            @if (!loading) {
              <span>Login</span>
            }
          </button>

        </form>
      </mat-card-content>
    </mat-card>
  </div>
